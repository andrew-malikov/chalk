name: Chalk CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-desktop:
    name: Review Desktop
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Hutch
        env:
          HUTCH_INSTALL_URL: ${{ vars.HUTCH_INSTALL_URL }}
        run: |
          curl -fsSL "${HUTCH_INSTALL_URL:?Set the HUTCH_INSTALL_URL repository variable}" -o "$RUNNER_TEMP/install-hutch.sh"
          bash "$RUNNER_TEMP/install-hutch.sh" --version 0.27.1 --no-modify-path
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - name: Install Playwright Chromium
        working-directory: apps/review-canvas
        run: bun --bun run playwright install chromium --only-shell
      - name: Build Chalk
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run desktop:build
      - name: Check tutorial assets
        run: bun run --filter @chalk/tutorial check
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Bundled diffr integration
        working-directory: packages/server
        run: |
          bun run ensure:diffr --required
          bun run --filter @chalk/server test:integration:diffr
      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-browser-diagnostics
          path: |
            apps/review-canvas/.vitest-attachments
            apps/review-canvas/**/__screenshots__
            apps/review-canvas/**/__traces__
          if-no-files-found: ignore
