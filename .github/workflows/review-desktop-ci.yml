name: Blackboard CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-desktop:
    name: Review Desktop
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Fetch legacy Review fixture commits
        run: |
          bun - <<'JS'
          import { readdirSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const dir = 'packages/review/src/fixtures/legacy-reviews';
          const commits = [...new Set(readdirSync(dir).filter(name => name.endsWith('.json')).flatMap(name => {
            const fixture = JSON.parse(readFileSync(`${dir}/${name}`, 'utf8'));
            return fixture.sourceRepository === 'devdotfast/review' ? [fixture.baseCommit, fixture.sourceCommit] : [];
          }))];
          if (!commits.length) throw new Error('Legacy fixture commits are missing');
          execFileSync('git', ['fetch', '--no-tags', 'origin', ...commits], {stdio: 'inherit'});
          for (const commit of commits) execFileSync('git', ['cat-file', '-e', `${commit}^{commit}`]);
          JS
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Hutch
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh -o "$RUNNER_TEMP/install-hutch.sh"
          bash "$RUNNER_TEMP/install-hutch.sh" --version 0.27.1 --no-modify-path
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - name: Install Playwright Chromium
        working-directory: packages/review/app
        run: bun --bun run playwright install chromium --only-shell
      - name: Build Blackboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run desktop:build
      - name: Check tutorial assets
        run: bun run --filter @blackboard/review check:tutorial
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Bundled diffr integration
        working-directory: packages/review
        run: |
          bun run ensure:diffr --required
          bun --bun run vitest run --config vitest.integration.config.ts
      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-browser-diagnostics
          path: |
            packages/review/app/.vitest-attachments
            packages/review/**/__screenshots__
            packages/review/**/__traces__
          if-no-files-found: ignore
