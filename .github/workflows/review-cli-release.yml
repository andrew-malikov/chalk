name: Blackboard CLI Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Next CLI version (calculated from npm releases and review-v tags)
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Build and test the npm tarball without tagging or publishing
        type: boolean
        default: false
  push:
    tags:
      - review-v*

permissions:
  contents: write
  id-token: write

concurrency:
  group: review-cli-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # npm's registry publisher runs under Bun to retain provenance support.
      - name: Configure registry authentication
        run: printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$HOME/.npmrc"
      - name: Install build dependencies
        run: bun install --frozen-lockfile
      - name: Resolve immutable release
        id: release
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: bun scripts/review-cli-release.mjs plan
      - name: Check release and headless behavior
        if: steps.release.outputs.published != 'true'
        run: |
          bun test scripts/review-cli-release.test.mjs scripts/review-cli-dependencies.test.mjs
          bun run --filter @blackboard/tutorial ensure:assets
          bun run --filter @blackboard/server test -- --project shared-module-graph src/headless-host.test.ts
          bun run --filter @blackboard/cli test
      - name: Build release tarball
        if: steps.release.outputs.published != 'true'
        run: bun scripts/pack-review-cli.mjs release-artifacts
      - name: Test installed tarball without Desktop
        if: steps.release.outputs.published != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bun scripts/smoke-review-cli.mjs "release-artifacts/blackboard-cli-${VERSION}.tgz" "$VERSION"
      - name: Validate npm publish command
        if: steps.release.outputs.published != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bunx --bun npm@12.2.0 publish "./release-artifacts/blackboard-cli-${VERSION}.tgz" --dry-run --registry=https://registry.npmjs.org --access public --tag latest --ignore-scripts
      - name: Retain tested package
        if: steps.release.outputs.published != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-cli-${{ steps.release.outputs.version }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
      - name: Authenticate publisher
        if: steps.release.outputs.published != 'true' && !inputs.dry_run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo 'NPM_TOKEN secret is missing.' >&2; exit 1; }
          bunx --bun npm@12.2.0 whoami --registry=https://registry.npmjs.org
      - name: Reserve release tag
        if: steps.release.outputs.published != 'true' && !inputs.dry_run
        # GITHUB_TOKEN tag pushes don't start another workflow. This run publishes below.
        run: bun scripts/review-cli-release.mjs tag
      - name: Publish tested package
        if: steps.release.outputs.published != 'true' && !inputs.dry_run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: bunx --bun npm@12.2.0 publish "./release-artifacts/blackboard-cli-${VERSION}.tgz" --registry=https://registry.npmjs.org --access public --tag latest --provenance --ignore-scripts
      - name: Release summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          PUBLISHED: ${{ steps.release.outputs.published }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Blackboard CLI ${VERSION}"
            echo "Source: ${COMMIT}; tag: ${RELEASE_TAG}"
            if [ "$DRY_RUN" = true ]; then
              echo 'Dry run: no tag or npm publication was created. Download the tested tarball from this run.'
            elif [ "$PUBLISHED" = true ]; then
              echo 'This exact version and source commit were already published; no changes made.'
            else
              echo "Install: bun add --global @blackboard/cli@${VERSION}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
